name: Action references

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-refs:
    name: action-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check action references
        run: python3 scripts/check_action_refs.py .github/workflows

      - name: Check component labelling
        run: node --test .github/scripts/component-labels.test.cjs

      - name: Check Sonar workflow isolation
        run: python3 -I .github/scripts/test_sonar_workflow.py
