name: Labels

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize]
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: labels-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default-branch code only; never execute PR code with a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const label = require('./.github/scripts/component-labels.cjs');
            await label({ github, context });
