name: Tests

# cspell:words esac

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Register Python problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Register pytest slow test problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/pytest-slow.json"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_all.txt

      - name: Run tests with coverage
        run: |
          .venv/bin/python -m pytest \
            --cov=pyicloud \
            --cov-branch \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --timeout=30

      - name: Enforce per-file combined line-and-branch coverage
        run: .venv/bin/python scripts/check/file_coverage.py coverage.xml

      - name: Check installed distributions on Python 3.15
        if: matrix.python-version == '3.15'
        run: |
          set -euo pipefail
          .venv/bin/pip install build
          .venv/bin/python -m build --sdist --wheel
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-installed.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          "$SMOKE_ROOT/runtime/bin/pip" install dist/*.whl
          python -m venv "$SMOKE_ROOT/cli"
          WHEEL=("$PWD"/dist/*.whl)
          "$SMOKE_ROOT/cli/bin/pip" install "${WHEEL[0]}[cli]"
          .venv/bin/pip wheel --no-deps --wheel-dir dist/from-sdist dist/*.tar.gz
          python -m venv "$SMOKE_ROOT/sdist"
          "$SMOKE_ROOT/sdist/bin/pip" install dist/from-sdist/*.whl
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST"
          "$SMOKE_ROOT/cli/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST" --cli
          "$SMOKE_ROOT/sdist/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST"

      # Keep one report per run, from a version supported by the Sonar analyzer.
      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  installed-minimum:
    name: Installed runtime minimum dependencies (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build and check an isolated minimum-runtime installation
        run: |
          set -euo pipefail
          python -m pip install build
          python scripts/check/minimum.py requirements.txt requirements_min.txt
          python -m build
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-minimum.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          "$SMOKE_ROOT/runtime/bin/pip" install -c requirements_min.txt dist/*.whl
          "$SMOKE_ROOT/runtime/bin/pip" check
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST"

  installed-extras:
    name: Installed extras (${{ matrix.extra }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.15"]
        extra: [core, cli, mcp, all]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and check extension isolation
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          WHEEL=("$PWD"/dist/*.whl)
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-extras.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          FLAGS=()
          SPEC="${WHEEL[0]}"
          case "$EXTRA" in
            core) ;;
            cli) SPEC+="[cli]"; FLAGS+=(--cli) ;;
            mcp) SPEC+="[mcp]"; FLAGS+=(--mcp) ;;
            all) SPEC+="[all]"; FLAGS+=(--cli --mcp) ;;
            *) exit 1 ;;
          esac
          "$SMOKE_ROOT/runtime/bin/pip" install "$SPEC"
          "$SMOKE_ROOT/runtime/bin/pip" check
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST" "${FLAGS[@]}"

  installed-mcp-minimum:
    name: Installed MCP minimum dependencies (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Check minimum runtime and optional SDK installation
        run: |
          set -euo pipefail
          python -m pip install build
          python scripts/check/minimum.py requirements_mcp.txt requirements_mcp_min.txt
          python -m build
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          WHEEL=("$PWD"/dist/*.whl)
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-mcp-minimum.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          "$SMOKE_ROOT/runtime/bin/pip" install -c requirements_min.txt -c requirements_mcp_min.txt "${WHEEL[0]}[mcp]"
          "$SMOKE_ROOT/runtime/bin/pip" check
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST" --mcp
