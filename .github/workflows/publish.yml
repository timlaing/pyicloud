name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'timlaing/pyicloud' && (github.event_name == 'release' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      ref: ${{ steps.source.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: source
        with:
          script: |
            if (context.eventName === 'release') {
              const { data } = await github.rest.repos.getCommit({ ...context.repo, ref: context.payload.release.tag_name });
              if (data.sha !== context.sha) throw new Error('Release revision changed after the event.');
              const source = require('./.github/scripts/quality-source.cjs');
              await source.requireMainQuality({ github, context, sha: data.sha });
              core.setOutput('ref', data.sha);
            } else {
              const source = require('./.github/scripts/quality-source.cjs');
              const ci = await source({ github, context });
              if (ci.event === 'push' && ci.head_branch === 'main') core.setOutput('ref', ci.head_sha);
            }

  validate:
    needs: source
    if: github.event_name == 'release'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  draft:
    needs: source
    if: github.event_name == 'workflow_run' && needs.source.outputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    needs: [source, validate]
    if: always() && needs.source.outputs.ref != '' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Validate distribution versions for PyPI
        run: |
          python - <<'PY'
          from pathlib import Path

          dist_dir = Path('dist')
          bad_files = sorted(
              file.name
              for file in dist_dir.glob('*')
              if file.is_file() and '+' in file.name and (file.name.endswith('.whl') or file.name.endswith('.tar.gz'))
          )

          if bad_files:
              print('ERROR: Local version segment (+...) detected in distribution filename(s), which PyPI rejects:')
              for name in bad_files:
                  print(f' - {name}')
              raise SystemExit(1)

          print('Distribution version filenames are valid for PyPI upload.')
          PY

      - name: Validate distribution metadata with twine
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/*

  pypi:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1

  test-pypi:
    needs: build
    if: always() && needs.build.result == 'success' && (github.event_name == 'workflow_run' || github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: test
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
