name: "Auto label issues"

# Adds needs-triage to every newly opened or reopened issue, regardless of
# whether it came from a template, a direct URL, the API or the CLI.
#
# This deliberately does no classification: it applies one label to everything
# and matches no keywords. Issues raised from the current Markdown templates
# still carry no type label, because those templates have no `labels:` front
# matter; adding those is scoped to a separate pull request.
#
# Ported from a sibling repository.

# yamllint disable-line rule:truthy
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  auto_label:
    name: Add triage label
    runs-on: ubuntu-latest

    steps:
      - name: Add triage label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "needs-triage"
