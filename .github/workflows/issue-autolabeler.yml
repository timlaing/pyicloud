name: "Auto label issues"

# Adds needs-triage to every newly opened or reopened issue, regardless of
# whether it came from a template, a direct URL, the API or the CLI.
#
# This deliberately does no classification: it applies one lifecycle label and
# matches no keywords. The issue *type* comes from the templates' own
# `labels:` front matter (bug / enhancement / support), which is deterministic
# because the reporter picked it. Type and triage state are therefore separate
# concerns, and neither depends on guessing from issue text.
#
# Ported from a sibling repository.

# yamllint disable-line rule:truthy
on:
  issues:
    types: [opened, reopened]

# gh issue edit touches nothing but issue labels, so this is the only
# permission the job needs. There is no checkout, so no contents access.
permissions:
  issues: write

jobs:
  auto_label:
    name: Add triage label
    runs-on: ubuntu-latest

    steps:
      - name: Add triage label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "needs-triage"
