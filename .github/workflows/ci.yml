name: CI

# cspell:words esac

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Register Python problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Register pytest slow test problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/pytest-slow.json"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_all.txt

      - name: Run tests with coverage
        run: |
          .venv/bin/python -m pytest \
            --cov=pyicloud \
            --cov-branch \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --timeout=30

      - name: Enforce per-file combined line-and-branch coverage
        run: .venv/bin/python scripts/check/file_coverage.py coverage.xml

      - name: Check installed distributions on Python 3.15
        if: matrix.python-version == '3.15'
        run: |
          set -euo pipefail
          .venv/bin/pip install build
          .venv/bin/python -m build --sdist --wheel
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-installed.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          "$SMOKE_ROOT/runtime/bin/pip" install dist/*.whl
          python -m venv "$SMOKE_ROOT/cli"
          WHEEL=("$PWD"/dist/*.whl)
          "$SMOKE_ROOT/cli/bin/pip" install "${WHEEL[0]}[cli]"
          .venv/bin/pip wheel --no-deps --wheel-dir dist/from-sdist dist/*.tar.gz
          python -m venv "$SMOKE_ROOT/sdist"
          "$SMOKE_ROOT/sdist/bin/pip" install dist/from-sdist/*.whl
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST"
          "$SMOKE_ROOT/cli/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST" --cli
          "$SMOKE_ROOT/sdist/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST"

      # Keep one report per run, from a version supported by the Sonar analyzer.
      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  installed-minimum:
    name: Installed runtime minimum dependencies (3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
      - name: Build and check an isolated minimum-runtime installation
        run: |
          set -euo pipefail
          python -m pip install build
          python scripts/check/minimum.py requirements.txt requirements_min.txt
          python -m build
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-minimum.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          "$SMOKE_ROOT/runtime/bin/pip" install -c requirements_min.txt dist/*.whl
          "$SMOKE_ROOT/runtime/bin/pip" check
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST"

  installed-extras:
    name: Installed extras (${{ matrix.extra }}, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
        extra: [core, cli, mcp, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and check extension isolation
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          CHECK_SCRIPT="$PWD/scripts/check/installed.py"
          MANIFEST="$PWD/tests/fixtures/compatibility/2026.10.1.json"
          WHEEL=("$PWD"/dist/*.whl)
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/pyicloud-extras.XXXXXX")"
          python -m venv "$SMOKE_ROOT/runtime"
          FLAGS=()
          SPEC="${WHEEL[0]}"
          case "$EXTRA" in
            core) ;;
            cli) SPEC+="[cli]"; FLAGS+=(--cli) ;;
            mcp) SPEC+="[mcp]"; FLAGS+=(--mcp) ;;
            all) SPEC+="[all]"; FLAGS+=(--cli --mcp) ;;
            *) exit 1 ;;
          esac
          "$SMOKE_ROOT/runtime/bin/pip" install "$SPEC"
          "$SMOKE_ROOT/runtime/bin/pip" check
          cd "$SMOKE_ROOT"
          "$SMOKE_ROOT/runtime/bin/python" -I "$CHECK_SCRIPT" --manifest "$MANIFEST" "${FLAGS[@]}"

  prek:
    name: Run prek checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/yamllint.json"
          echo "::add-matcher::.github/workflows/matchers/check-json.json"
          echo "::add-matcher::.github/workflows/matchers/check-executables-have-shebangs.json"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements_all.txt

      - name: Install Prettier dependencies
        run: npm ci

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'requirements*.txt') }}

      - name: Run prek
        run: |
          source .venv/bin/activate
          prek run --all-files

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install ".[cli]"

      - name: Build documentation
        run: mkdocs build --strict

  policy:
    name: Workflow and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --only-binary=:all: packaging PyYAML==6.0.3
      - run: python scripts/check_action_refs.py .github/workflows
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
      - run: node --test .github/scripts/*.test.cjs
      - run: python3 -I .github/scripts/test_sonar_workflow.py
      - run: python3 -I .github/scripts/test_ha_requirements.py
      - run: python3 -I .github/scripts/test_workflow_policy.py
      - run: python3 -I .github/scripts/test_review_notifier.py
      - name: Check Home Assistant release compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ha_release_tag="$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)"
          python scripts/check/ha_requirements.py --release "$ha_release_tag"
      - name: Check PR maintainer editing
        if: github.event_name == 'pull_request'
        run: python -m scripts.check.edits

  result:
    name: CI passed
    needs: [test, installed-minimum, installed-extras, prek, docs, policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all validation jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Validation did not pass: ' + ', '.join(failed))
          PYTHON
