name: SonarQube

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

jobs:
  sonarqube:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Set scan paths
        run: echo "COVERAGE_DIR=$RUNNER_TEMP/sonar-coverage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Require SonarQube credentials
        env:
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        run: test "$HAS_SONAR_TOKEN" = true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          # workflow_run runs with the base repository's GITHUB_TOKEN, secrets and
          # runner, so actions/checkout v7 refuses fork PR code by default and the
          # scan failed for every fork PR. The untrusted surface is bounded below:
          # no PR code is executed, symlinks and scanner config are rejected or
          # removed, and isolated validation runs without the Sonar token.
          allow-unsafe-pr-checkout: true

      - name: Prepare scan inputs
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          # Do not follow PR-controlled links into runner files or configuration.
          for root, dirs, files in os.walk('.'):
              if root == '.':
                  dirs[:] = [name for name in dirs if name != '.git']
              for name in dirs + files:
                  candidate = Path(root) / name
                  if candidate.is_symlink():
                      raise SystemExit(f'Symlink is not a scan input: {candidate}')
          Path('sonar-project.properties').unlink(missing_ok=True)
          PY

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: ${{ env.COVERAGE_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate coverage report
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          directory = Path(os.environ['COVERAGE_DIR'])
          report = directory / 'coverage.xml'
          if directory.is_symlink() or report.is_symlink() or not report.is_file():
              raise SystemExit('Coverage report missing or symlinked')
          # Bound the read as well as the file size. Accept UTF-8 Cobertura only;
          # other encodings must not bypass the entity-declaration check.
          if report.stat().st_size >= 10_000_000:
              raise SystemExit('Coverage report too large')
          with report.open('rb') as stream:
              data = stream.read(10_000_000)
          if len(data) >= 10_000_000:
              raise SystemExit('Coverage report too large')
          text = data.decode('utf-8-sig')
          if '\x00' in text or re.search(r'<!ENTITY', text, re.IGNORECASE):
              raise SystemExit('Coverage report contains an entity or invalid encoding')
          # A plain DOCTYPE is allowed for older Cobertura writers.
          ET.fromstring(text)
          PY

      - name: Validate run metadata
        id: validate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_REF: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid HEAD_SHA"; exit 1; }
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$RUN_EVENT" != "pull_request" ]]; then
            exit 0
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            # workflow_run.pull_requests is empty for fork PRs; resolve via the API.
            PR_FILE="$(mktemp)"
            gh pr list --state open --limit 1000 --json number,headRefName,headRefOid,baseRefName > "$PR_FILE"
            PR_MATCHES="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.headRefOid == $sha)]' "$PR_FILE")"
            rm -f "$PR_FILE"
            if [[ "$(jq 'length' <<< "$PR_MATCHES")" -gt 1 ]]; then
              echo "Multiple open PRs match $HEAD_SHA"; exit 1
            fi
            PR_MATCH="$(jq -c '.[0] // empty' <<< "$PR_MATCHES")"
            if [[ -n "$PR_MATCH" ]]; then
              PR_NUMBER="$(jq -r '.number' <<< "$PR_MATCH")"
              HEAD_REF="$(jq -r '.headRefName' <<< "$PR_MATCH")"
              BASE_REF="$(jq -r '.baseRefName' <<< "$PR_MATCH")"
            fi
          fi
          if [[ -z "$PR_NUMBER" || -z "$HEAD_REF" || -z "$BASE_REF" ]]; then
            echo "Could not resolve pull request metadata for $HEAD_SHA"; exit 1
          fi
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 1; }
          [[ "$HEAD_REF" =~ ^[a-zA-Z0-9][a-zA-Z0-9/_.-]*$ ]] || { echo "Invalid head branch"; exit 1; }
          [[ "$BASE_REF" =~ ^[a-zA-Z0-9][a-zA-Z0-9/_.-]*$ ]] || { echo "Invalid base branch"; exit 1; }
          {
            echo "pr-number=$PR_NUMBER"
            echo "head-ref=$HEAD_REF"
            echo "base-ref=$BASE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan (branch)
        if: github.event.workflow_run.event == 'push'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=timlaing_pyicloud
            -Dsonar.organization=timlaing
            -Dsonar.projectName=pyicloud
            -Dsonar.sources=pyicloud
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=${{ env.COVERAGE_DIR }}/coverage.xml
            -Dsonar.working.directory=${{ runner.temp }}/sonar-work-${{ github.run_id }}-${{ github.run_attempt }}
            -Dsonar.python.version=3.10
            -Dsonar.scm.revision=${{ steps.validate.outputs.head-sha }}
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Scan (pull request)
        if: github.event.workflow_run.event == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=timlaing_pyicloud
            -Dsonar.organization=timlaing
            -Dsonar.projectName=pyicloud
            -Dsonar.sources=pyicloud
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=${{ env.COVERAGE_DIR }}/coverage.xml
            -Dsonar.working.directory=${{ runner.temp }}/sonar-work-${{ github.run_id }}-${{ github.run_attempt }}
            -Dsonar.python.version=3.10,3.11,3.12,3.13,3.14
            -Dsonar.scm.revision=${{ steps.validate.outputs.head-sha }}
            -Dsonar.pullrequest.key=${{ steps.validate.outputs.pr-number }}
            -Dsonar.pullrequest.branch=${{ steps.validate.outputs.head-ref }}
            -Dsonar.pullrequest.base=${{ steps.validate.outputs.base-ref }}
            -Dsonar.pullrequest.provider=github
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.qualitygate.wait=true
