name: Review status

on:
  workflow_run:
    workflows: [Review events]
    types: [completed]

permissions: {}

jobs:
  recheck:
    name: Re-evaluate CodeRabbit approval
    if: github.event.workflow_run.path == '.github/workflows/review-events.yml' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Covers both the 40-minute validation and 40-minute review windows.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      actions: read
      statuses: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      result: ${{ steps.review.outputs.result || steps.setup-failure.outputs.result }}
    steps:
      # Publish pending before checkout so an earlier green status cannot remain
      # current if checkout or the worker fails. The long wait below holds no
      # shared concurrency group; only the final publication job does.
      - name: Resolve head and mark pending
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const trigger = context.payload.workflow_run;
            if (!['pull_request', 'pull_request_review'].includes(trigger.event)) return;
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: trigger.head_sha, per_page: 100
            });
            const candidates = associated.filter(pr => pr.state === 'open' && !pr.draft &&
              pr.base.ref === 'main' && pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              [pr.head.sha, pr.merge_commit_sha].includes(trigger.head_sha));
            if (candidates.length < 1) return;
            if (candidates.length > 1) {
              for (const revision of new Set(candidates.map(pr => pr.head.sha)))
                await github.rest.repos.createCommitStatus({
                  ...context.repo, sha: revision, context: 'Quality', state: 'failure',
                  description: 'Ambiguous PR head; use a unique revision per PR',
                  target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                });
              return;
            }
            const sha = candidates[0].head.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, context: 'Quality', state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Re-evaluate CodeRabbit approval
        id: review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD: ${{ steps.target.outputs.sha }}
        with:
          script: |
            if (!process.env.HEAD) return;
            try {
              const review = require('./.github/scripts/review.cjs');
              await review({ github, context, core });
              core.setOutput('result', 'success');
            } catch (error) {
              core.error(`Review re-evaluation failed: ${error.message}`);
              core.setOutput('result', 'failure');
            }
      - name: Record setup failure
        id: setup-failure
        if: failure() && steps.review.outputs.result == ''
        run: echo "result=failure" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Quality result
    needs: recheck
    if: always() && needs.recheck.outputs.sha != '' && needs.recheck.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Observer publication uses its own group so it cannot cancel or replace a
      # queued native Quality scan run; only observer publications serialize here.
      group: review-publication-${{ needs.recheck.outputs.sha }}
      cancel-in-progress: false
    permissions:
      statuses: write
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD: ${{ needs.recheck.outputs.sha }}
          RESULT: ${{ needs.recheck.outputs.result }}
        with:
          script: |
            let result = process.env.RESULT;
            // A withdrawal or regressed check after the worker read must not
            // leave a stale success. Mirror review.cjs's required-check list.
            if (result === 'success') {
              try {
                const required = ["CI passed", "SonarCloud", "CodeQL", "Review notifier policy"];
                for (const ref of new Set([context.payload.workflow_run?.head_sha, process.env.HEAD].filter(Boolean))) {
                  const checks = await github.paginate(github.rest.checks.listForRef, {
                    ...context.repo, ref, filter: "latest", per_page: 100 });
                  for (const name of required) {
                    if (!checks.some(c => c.name === name && c.status === "completed" && c.conclusion === "success")) {
                      result = 'failure';
                    }
                  }
                }
                const associated = await github.paginate(
                  github.rest.repos.listPullRequestsAssociatedWithCommit,
                  { ...context.repo, commit_sha: process.env.HEAD, per_page: 100 });
                const candidates = associated.filter(pr => pr.state === 'open' && !pr.draft &&
                  pr.base.ref === 'main' && pr.head.sha === process.env.HEAD &&
                  pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}`);
                if (candidates.length !== 1) {
                  result = 'failure';
                } else {
                  const reviews = await github.paginate(github.rest.pulls.listReviews, {
                    ...context.repo, pull_number: candidates[0].number, per_page: 100 });
                  const latest = reviews
                    .filter(r => r.user?.login === 'coderabbitai[bot]' &&
                      r.commit_id === process.env.HEAD && r.state !== 'COMMENTED')
                    .at(-1);
                  if (latest?.state !== 'APPROVED') result = 'failure';
                }
              } catch (error) {
                core.error(`Publish-time approval check failed: ${error.message}`);
                result = 'failure';
              }
            }
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD, context: 'Quality',
              state: result,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
