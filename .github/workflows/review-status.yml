name: Review status

on:
  workflow_run:
    workflows: [Review events]
    types: [completed]

permissions: {}

concurrency:
  # Quality and the review worker share one publisher group per head so they
  # cannot create duplicate requests or publish conflicting results.
  group: quality-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review-event:
    name: Re-evaluate CodeRabbit approval
    if: github.event.workflow_run.path == '.github/workflows/review-events.yml' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
      actions: read
      statuses: write
    steps:
      # Publish pending before checkout so an earlier green status cannot remain
      # current if checkout or the worker fails.
      - name: Resolve head and mark pending
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const trigger = context.payload.workflow_run;
            if (!['pull_request', 'pull_request_review'].includes(trigger.event)) return;
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: trigger.head_sha, per_page: 100
            });
            const candidates = associated.filter(pr => pr.state === 'open' && !pr.draft &&
              pr.base.ref === 'main' && pr.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              [pr.head.sha, pr.merge_commit_sha].includes(trigger.head_sha));
            if (candidates.length < 1) return;
            const fail = async (revision, description) => github.rest.repos.createCommitStatus({
              ...context.repo, sha: revision, context: 'Quality', state: 'failure',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (candidates.length > 1) {
              for (const revision of new Set(candidates.map(pr => pr.head.sha)))
                await fail(revision, 'Ambiguous PR head; use a unique revision per PR');
              return;
            }
            const sha = candidates[0].head.sha;
            core.setOutput('sha', sha);
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, context: 'Quality', state: 'pending',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Re-evaluate CodeRabbit approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const sha = process.env.HEAD;
            if (!sha) return;
            const status = state => github.rest.repos.createCommitStatus({
              ...context.repo, sha, context: 'Quality', state,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            try {
              const review = require('./.github/scripts/review.cjs');
              await review({ github, context, core });
              await status('success');
            } catch (error) {
              await status('failure');
              throw error;
            }
      - name: Fail unresolved head on setup error
        if: failure() && steps.target.outputs.sha != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          HEAD: ${{ steps.target.outputs.sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD, context: 'Quality', state: 'failure',
              description: 'Review re-evaluation could not complete',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
