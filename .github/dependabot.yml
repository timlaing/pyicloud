# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - devcontainers
  - package-ecosystem: "pip"
    directory: "/"
    # Minimum-runtime pins track declared lower bounds, not newest dependency
    # releases. Dependabot never upgrades them independently. When a runtime
    # lower bound in requirements.txt is changed, update requirements_min.txt in
    # the same change and verify with scripts/check/minimum.py in CI.
    exclude-paths:
      - "requirements_min.txt"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - pip
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github_actions
