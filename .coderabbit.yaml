# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: true
    description_keyword: ""
  auto_approvals:
    enabled: true
    allow_author_approval: true
    # Require a reviewed current commit without excluding any risk category.
    max_merge_risk: critical
inheritance: true
